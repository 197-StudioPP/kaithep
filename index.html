/* ===== cloud (Firebase): optional login so a farm follows you to any device ===== */
window.CLOUD=(function(){
 const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey)return null;
 const base='https://www.gstatic.com/firebasejs/12.17.1/';
 let A=null;const sameDom=cfg.authDomain===location.host;
 const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
 const ready=load(base+'firebase-app-compat.js').then(()=>Promise.all([load(base+'firebase-auth-compat.js'),load(base+'firebase-firestore-compat.js')])).then(()=>{
  if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();A=auth;
  /* Safari บางทีที่เก็บ IndexedDB ค้าง ("Database is closing/hidden") → เช็กก่อน ถ้าพังให้ใช้ที่เก็บสำรอง */
  const idbOk=()=>new Promise(res=>{let d=0;const fin=v=>{if(!d){d=1;res(v);}};setTimeout(()=>fin(false),1500);
   try{const r=indexedDB.open('kt_probe',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('p');}catch(e){}};
    r.onsuccess=()=>{try{const db=r.result,tx=db.transaction('p','readwrite');tx.objectStore('p').put(Date.now(),'t');tx.oncomplete=()=>{db.close();fin(true);};tx.onerror=tx.onabort=()=>{try{db.close();}catch(e){}fin(false);};}catch(e){fin(false);}};
    r.onerror=r.onblocked=()=>fin(false);}catch(e){fin(false);}});
  const P=firebase.auth.Auth.Persistence;
  return idbOk().then(ok=>{window.__idbOk=ok;return ok?null:auth.setPersistence(P.SESSION).catch(()=>auth.setPersistence(P.NONE)).catch(()=>{});}).then(()=>auth.getRedirectResult()).catch(()=>null).then(()=>new Promise(r=>{const un=auth.onAuthStateChanged(u=>{un();r({auth,db,user:u});});}));
 });
 ready.catch(()=>{});
 const errTh=e=>{const c=(e&&e.code)||'';if(/closing|indexed ?db|indexed database/i.test((e&&e.message)||'')){try{if(A)A.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});}catch(_){}return 'ที่เก็บข้อมูลของ Safari ค้าง — เกมสลับไปใช้ที่เก็บสำรองแล้ว แตะเข้าสู่ระบบอีกครั้งได้เลย';}return ({
  'auth/invalid-email':'อีเมลไม่ถูกต้อง','auth/user-not-found':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/wrong-password':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/invalid-login-credentials':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'auth/email-already-in-use':'อีเมลนี้สมัครไว้แล้ว ลองกด "เข้าสู่ระบบ"','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัว',
  'auth/popup-closed-by-user':'ปิดหน้าต่างก่อนเข้าสู่ระบบเสร็จ','auth/cancelled-popup-request':'ปิดหน้าต่างก่อนเข้าสู่ระบบเสร็จ',
  'auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase (Authentication → Settings → Authorized domains)',
  'auth/operation-not-allowed':'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase','auth/network-request-failed':'เน็ตมีปัญหา ลองใหม่อีกครั้ง',
  'auth/too-many-requests':'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่','auth/missing-password':'กรอกรหัสผ่านด้วย',
  'auth/web-storage-unsupported':'เบราว์เซอร์นี้ปิดการเก็บข้อมูลไว้ — เปิดลิงก์เกมใน Chrome หรือ Safari (ปิดโหมดไม่ระบุตัวตน)',
  'auth/operation-not-supported-in-this-environment':(location.protocol!=='https:'&&location.protocol!=='http:')?'ล็อกอิน Google ไม่ได้เพราะเปิดเกมจากไฟล์ในเครื่อง — ต้องเปิดผ่านลิงก์เว็บ (https://…netlify.app) หรือใช้ล็อกอินด้วยอีเมลแทน':'เบราว์เซอร์ในแอปนี้ (LINE/Facebook/IG ฯลฯ) ล็อกอิน Google ไม่ได้ — กด ⋮ หรือ ⋯ แล้วเลือก "เปิดใน Chrome/Safari" หรือใช้ล็อกอินด้วยอีเมลแทน',
  'auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้อนุญาตใน Firebase — Firebase Console → Authentication → Settings → Authorized domains → เพิ่มโดเมนเว็บเกม',
  'auth/popup-closed-by-user':'ปิดหน้าต่างล็อกอินก่อนเสร็จ ลองใหม่อีกครั้ง',
  'auth/popup-blocked':'เบราว์เซอร์บล็อกหน้าต่างล็อกอิน — แตะปุ่ม Google อีกครั้ง หรือใช้อีเมล+รหัสผ่านแทน (ได้ผลเหมือนกัน)',
  'auth/disallowed-useragent':'เบราว์เซอร์ในแอปนี้ล็อกอิน Google ไม่ได้ — เปิดลิงก์ใน Chrome/Safari หรือใช้อีเมลแทน'}[c])||('เกิดข้อผิดพลาด: '+(c||(e&&e.message)||'ไม่ทราบสาเหตุ'));};
 return {ready,errTh,getAuth:()=>A,sameDom};
})();
/* ===== player profiles: each player has their own farm ===== */
(function(){
 const LK='kaitep_profiles';
 const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
 const ss={get:k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}}};
 const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let P=[];try{P=JSON.parse(ls.get(LK))||[];}catch(e){P=[];}
 const old=ls.get('kaitep_v1');
 if(old){try{const o=JSON.parse(old);const id='p'+Date.now().toString(36);ls.set('kaitep_p_'+id,old);P.push({id,n:(o&&o.nick)||'ผู้เล่น 1'});ls.set(LK,JSON.stringify(P));}catch(e){}ls.del('kaitep_v1');}
 window.__profiles={list:()=>{try{return JSON.parse(ls.get(LK))||[];}catch(e){return [];}},
  rename:(id,n)=>{const L=window.__profiles.list();const x=L.find(p=>p.id===id);if(x){x.n=n;ls.set(LK,JSON.stringify(L));}},
  switchTo:()=>{ss.set('kaitep_pid','');location.reload();}};
 const pid=ss.get('kaitep_pid');
 const cur=P.find(p=>p.id===pid);
 if(cur){window.__PID=cur.id;window.__PNAME=cur.n;return;}
 const box=document.getElementById('profBox'),wrap=document.getElementById('prof');
 let armDel=null,cloud={state:window.CLOUD?'loading':'off',user:null,msg:'',busy:false,choose:null};
 function pick(id){ss.set('kaitep_pid',id);location.reload();}
 const sumOf=id=>{try{const d=JSON.parse(ls.get('kaitep_p_'+id));if(d)return `🪙${(d.coins||0).toLocaleString()} • 🐔 ${(d.items||[]).filter(i=>i.st===2).length} ตัว • 🗼 ${d.towerBest||0}`;}catch(e){}return '';};
 const nameOf=u=>(u.displayName||(u.email||'').split('@')[0]||'ผู้เล่น').slice(0,16);
 // --- enter the game with a cloud account: newest copy wins
 function enterCloud(){
  const u=cloud.user;if(!u)return;const cid='fb_'+u.uid;cloud.busy=true;cloud.msg='⏳ กำลังโหลดฟาร์มจากคลาวด์...';render();
  window.CLOUD.ready.then(({db})=>db.collection('saves').doc(u.uid).get()).then(doc=>{
   const local=ls.get('kaitep_p_'+cid);let lt=0;try{lt=(JSON.parse(local)||{}).t||0;}catch(e){}
   if(doc.exists&&doc.data()&&doc.data().data){const d=doc.data();if(!local||(d.t||0)>=lt)ls.set('kaitep_p_'+cid,d.data);finishCloud();return;}
   if(local){finishCloud();return;}
   const L=window.__profiles.list().filter(p=>!p.cloud&&ls.get('kaitep_p_'+p.id));
   if(!L.length){finishCloud();return;}
   cloud.busy=false;cloud.choose=L;cloud.msg='';render();
  }).catch(e=>{cloud.busy=false;cloud.msg='⚠️ โหลดข้อมูลคลาวด์ไม่ได้: '+(e&&e.code==='permission-denied'?'กฎฐานข้อมูล (Rules) ยังไม่ถูกต้อง':'เน็ตมีปัญหา ลองใหม่');render();});
 }
 function finishCloud(fromLocal){
  const u=cloud.user,cid='fb_'+u.uid;
  if(fromLocal){const d=ls.get('kaitep_p_'+fromLocal);if(d)ls.set('kaitep_p_'+cid,d);}
  const L=window.__profiles.list().filter(p=>p.id!==cid);L.unshift({id:cid,n:nameOf(u),cloud:true,email:u.email||''});ls.set(LK,JSON.stringify(L));
  pick(cid);
 }
 function cloudHTML(){
  if(cloud.state==='off')return '';
  let h=`<div style="background:#fff;border:3px solid #3b2a1a;border-radius:18px;padding:10px;margin-bottom:12px;text-align:left"><div style="font-weight:600;font-size:16px">☁️ บัญชีออนไลน์ <small style="font-weight:400;color:#7a6346">— เล่นต่อได้ทุกเครื่อง</small></div>`;
  if(cloud.state==='loading')h+=`<div class="sub" style="margin-top:6px">⏳ กำลังเชื่อมต่อ...</div>`;
  else if(cloud.state==='error')h+=`<div class="sub" style="margin-top:6px">⚠️ เชื่อมต่อระบบล็อกอินไม่ได้ (เน็ตหรือการตั้งค่า Firebase) — เล่นแบบในเครื่องด้านล่างได้</div>`;
  else if(cloud.choose){h+=`<div style="margin-top:6px;font-size:14px">บัญชีนี้ยังไม่มีฟาร์ม จะนำฟาร์มในเครื่องขึ้นบัญชี หรือเริ่มใหม่?</div>`+cloud.choose.map(p=>`<button class="pbtn" data-up="${esc(p.id)}" style="margin-top:6px"><span style="font-size:24px">⬆️</span><span><b>นำ "${esc(p.n)}" ขึ้นบัญชี</b><br><small>${sumOf(p.id)}</small></span></button>`).join('')+`<button class="btn" id="cNew" style="width:100%;margin-top:4px">🌱 เริ่มฟาร์มใหม่ในบัญชีนี้</button>`;}
  else if(cloud.user){const u=cloud.user;h+=`<div style="margin-top:6px;font-size:14px">เข้าสู่ระบบเป็น <b>${esc(u.displayName||u.email||'ผู้เล่น')}</b>${u.email&&u.displayName?`<br><small style="color:#7a6346">${esc(u.email)}</small>`:''}</div>
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn g" id="cPlay" style="flex:1;font-size:17px" ${cloud.busy?'disabled':''}>▶️ เล่นด้วยบัญชีนี้</button><button class="btn" id="cOut" ${cloud.busy?'disabled':''}>ออกจากระบบ</button></div>`;}
  else{const ENV=window.__kaitepEnv();if(ENV)h+=`<div class="sub" style="margin-top:6px;background:#fff1d6;border:2px solid #e2a13a;border-radius:10px;padding:6px 8px;color:#7a4a10;text-align:left">${ENV}</div>`;
   h+=`<button class="btn" id="cGoogle" style="width:100%;margin-top:8px;background:#fff;font-size:16px" ${cloud.busy?'disabled':''}><b style="color:#4285f4">G</b> เข้าสู่ระบบด้วย Google</button>
   <div class="sub" style="text-align:center;margin:6px 0">หรือใช้อีเมล</div>
   <input id="cEmail" type="email" autocomplete="email" placeholder="อีเมล" style="width:100%;font:inherit;font-size:16px;border:2px solid #e2cfa5;border-radius:12px;padding:7px 10px;margin-bottom:6px">
   <input id="cPass" type="password" autocomplete="current-password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" style="width:100%;font:inherit;font-size:16px;border:2px solid #e2cfa5;border-radius:12px;padding:7px 10px">
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn g" id="cLogin" style="flex:1" ${cloud.busy?'disabled':''}>เข้าสู่ระบบ</button><button class="btn b" id="cReg" style="flex:1" ${cloud.busy?'disabled':''}>สมัครใหม่</button></div>
   <button class="btn" id="cForgot" style="width:100%;margin-top:6px;font-size:13px;box-shadow:none;border-width:2px">ลืมรหัสผ่าน?</button>`;}
  if(cloud.msg)h+=`<div class="sub" style="margin-top:8px;color:${cloud.msg.startsWith('✅')?'#2f7d22':'#b3412b'}">${esc(cloud.msg)}</div>`;
  return h+'</div>';
 }
 function bindCloud(){
  const q=id=>document.getElementById(id);
  const run=(fn)=>{cloud.busy=true;cloud.msg='';render();window.CLOUD.ready.then(fn).then(()=>{cloud.busy=false;render();}).catch(e=>{cloud.busy=false;cloud.msg='⚠️ '+window.CLOUD.errTh(e);render();});};
  const after=r=>{if(r&&r.user){cloud.user=r.user;cloud.msg='';}};
  if(q('cGoogle'))q('cGoogle').onclick=()=>{const A=window.CLOUD.getAuth();
   if(!A){cloud.msg='⏳ กำลังโหลดระบบล็อกอิน... แตะปุ่ม Google อีกครั้งใน 2 วินาที';render();return;}
   /* เปิด popup ทันทีตอนแตะ (ห้ามรอ async ก่อน ไม่งั้น iPhone บล็อก) */
   const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});const pp=A.signInWithPopup(pr);
   cloud.busy=true;cloud.msg='';render();
   pp.then(r=>{cloud.busy=false;after(r);render();}).catch(e=>{cloud.busy=false;
    if(e&&e.code==='auth/popup-blocked'&&window.CLOUD.sameDom){A.signInWithRedirect(pr);return;}
    cloud.msg='⚠️ '+window.CLOUD.errTh(e);render();});};
  const ep=()=>[(q('cEmail').value||'').trim(),q('cPass').value||''];
  if(q('cLogin'))q('cLogin').onclick=()=>{const [e,p]=ep();run(({auth})=>auth.signInWithEmailAndPassword(e,p).then(after));};
  if(q('cReg'))q('cReg').onclick=()=>{const [e,p]=ep();run(({auth})=>auth.createUserWithEmailAndPassword(e,p).then(after));};
  if(q('cForgot'))q('cForgot').onclick=()=>{const [e]=ep();if(!e){cloud.msg='⚠️ กรอกอีเมลก่อน แล้วกด "ลืมรหัสผ่าน?"';render();return;}
   run(({auth})=>auth.sendPasswordResetEmail(e).then(()=>{cloud.msg='✅ ส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลแล้ว (ดูในกล่องจดหมาย/สแปมด้วย)';}));};
  if(q('cPlay'))q('cPlay').onclick=enterCloud;
  if(q('cOut'))q('cOut').onclick=()=>run(({auth})=>auth.signOut().then(()=>{cloud.user=null;}));
  if(q('cNew'))q('cNew').onclick=()=>{cloud.choose=null;finishCloud();};
  box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{cloud.choose=null;finishCloud(b.dataset.up);});
 }
 function render(){

function catchUp(sec,why,nb){sec=Math.min(86400,Math.max(0,sec));if(sec<=3)return;const eg0=S.fm&&S.fm.rd?Math.floor(S.fm.rd.egg):0,rd0=S.slots.filter(x=>x&&x.p>=1).length,b0=S.bank,c0=S.coins;
 hatchQuiet={};const step=Math.max(2,sec/3000);for(let t=0;t<sec;t+=step)tick(Math.min(step,sec-t));if(nb){S.bank=b0;S.coins=c0;}
 hatchQuiet=null;const rd=S.slots.filter(x=>x&&x.p>=1).length-rd0,eg=(S.fm&&S.fm.rd?Math.floor(S.fm.rd.egg):0)-eg0,bank=Math.floor(S.bank-b0);
 const f=S.fm&&Array.isArray(S.fm.plots)&&Array.isArray(S.fm.kit)?S.fm:null,now=Date.now(),crop=f?f.plots.filter(p=>p.s==='g'&&now>=p.t).length:0,food=f?f.kit.filter(k=>k&&now>=k.t).length:0;
 const msg=[bank>0?`🏭 +🪙${fmt(bank)}`:'',rd>0?`🥚 ฟักเสร็จ ${rd}`:'',eg>0?`🐔 ไข่ใหม่ ${eg}`:'',crop?`🌽 สุก ${crop} แปลง`:'',food?`🍳 อาหารเสร็จ ${food}`:''].filter(Boolean);
 save();if(msg.length&&sec>=30){if(nb)setTimeout(()=>toast(`⏰ ${why} ${fmtDur(sec)}: ${msg.join(' • ')}`),200);else setTimeout(()=>afkShow(why||'ระหว่างไม่อยู่',sec,msg),why?300:1200);}}
catchUp((Date.now()-(S.t||Date.now()))/1000);
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else if(hiddenAt){const s2=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();catchUp(s2,'ระหว่างปิดจอ');}});

 const T=it.tier|0;G.steps=[];let d=500;

 const open=()=>{if(!G||G.stage)return;G.steps.forEach(clearTimeout);eg.style.setProperty('--gc',GLOW[T]);G.stage=1;crackGacha();};

const cbRng=seed=>{let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
const cbHash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};

const adults=()=>S.items.filter(i=>i.st===2);
function t4Auto(){S.t4=adults().filter(i=>!isWorker(i.id)).sort((a,b)=>b.tier-a.tier||(b.lv||1)-(a.lv||1)).slice(0,4).map(i=>i.id);while(S.t4.length<4)S.t4.push(null);}
function t4Ids(){const ok=new Set(adults().filter(i=>!isWorker(i.id)).map(i=>i.id));if(!Array.isArray(S.t4))t4Auto();const seen=new Set();S.t4=S.t4.slice(0,4).map(id=>id!=null&&ok.has(id)&&!seen.has(id)?(seen.add(id),id):null);while(S.t4.length<4)S.t4.push(null);if(!S.t4.some(x=>x!=null)&&ok.size)t4Auto();return S.t4;}
const t4Items=()=>t4Ids().map(id=>id==null?null:S.items.find(i=>i.id===id));
const tbMine=()=>t4Items().filter(Boolean).map(it=>({it}));
const t4Spec=()=>t4Items().map(it=>it?{ch:it.ch,tier:it.tier|0,lv:it.lv||1,en:it.en|0,name:it.name,sh:it.sh?1:0}:null).filter(Boolean);
const t4Slots=()=>t4Items().map(it=>it?it.ch:null);
const tbMySpec=t4Spec;
function cbTribes(units){const c={};let any=0;units.forEach(u=>{const t=CTRIBE[u.ch];if(t==='any')any++;else if(t)c[t]=(c[t]||0)+1;});Object.keys(c).forEach(k=>c[k]+=any);return {c,any};}
function cbSide(units,name,slots){const s={name,units,slots:slots||units.map(u=>u.ch).concat([null,null,null,null]).slice(0,4),max:0,ar:0,atk:0,sk:0,ult:0,skI:0,food:0,fed:0,hits:0,tb:[],nx:[],dot:[],stun:0,streak:0,hot:0,own:0,has:{},ultRate:0};
 units.forEach(u=>{const c=chOf(u.ch)||{hp:50,ar:25,atk:18},lv=u.lv||1,en=u.en|0;s.has[u.ch]=1;s.max+=c.hp*(1+.06*(lv-1)+.05*en);s.ar+=c.ar*(1+.03*(lv-1));s.atk+=c.atk*(1+.05*(lv-1)+.05*en);});
 const T=cbTribes(units);s.tr=T.c;if(T.c.gang>=2)s.max*=1.1;if(T.c.gold>=2)s.ar*=1.1;if(T.c.sky>=2)s.ult=100;if(T.c.food>=2)s.food=1;
 if(T.any){const k=1+.02*T.any;s.max*=k;s.ar*=k;s.atk*=k;}
 s.max=Math.round(s.max*(units[0]&&units[0].hpx||1));s.ar=Math.round(s.ar);s.atk=Math.round(s.atk);s.hp=s.max;return s;}
function cbPair(A,B,rng){rng=rng||Math.random;[[A,B],[B,A]].forEach(([x,y])=>{if(x.tr.myst>=2)y.ar=Math.round(y.ar*.9);if(x.tr.blood>=2){y.max=Math.round(y.max*.9);y.hp=y.max;}
 if(x.has.boss)y.tb.push({atk:-10,t:3});if(x.has.skyking)x.ult=Math.max(x.ult,50);if(x.has.rainbow)x.rb=rbuf(x,rng);});}
const sm=(s,k)=>s.tb.reduce((a,b)=>a+(b[k]||0),0);
function nxAgg(s){const a={};s.nx.forEach(x=>{for(const k in x)if(k!=='n')a[k]=(a[k]||0)+x[k];});return a;}
function aimMods(s){const n=nxAgg(s);return {gw:(n.gw||0)+sm(s,'gw'),slow:(n.slow||0)+sm(s,'slow')+(s.has.sleepy?.15:0),acc:(n.acc||0)+sm(s,'acc'),center:n.center||0,perfAny:n.perfAny||0};}
const aAtk=s=>Math.max(1,(s.atk+sm(s,'atk')+s.hot*4)*(1+sm(s,'atkPct')));
const aAr=s=>Math.max(0,s.ar+sm(s,'ar')+(s.has.lost&&s.hp<s.max*.5?16:0)+(s.has.hero&&s.hp<s.max*.3?20:0));
function ultOk(s){const u=s.slots[3];if(u==='colonel'&&s.streak>=3)return true;if(u==='scar')return s.ult>=100||(s.hp<s.max*.5&&s.ult>=60);return s.ult>=100||(s.hp<s.max*.3&&s.ult>=50);}
const skSlot=s=>{for(let i=0;i<3;i++){const k=(s.skI+i)%3;if(s.slots[k])return k;}return -1;};
function rollKind(rng,acc,m){m=m||{gw:0,slow:0,acc:0};const g=Math.max(.05,Math.min(.92,acc.g*(1+m.gw)*(1+m.slow*.6)+m.acc+(m.center?.1:0))),p=Math.max(0,Math.min(.6,acc.p*(1+m.gw*.5)*(1+m.slow*.6)+m.acc*.3+(m.center?.04:0)));
 const r=rng();let k=r<p?'p':r<Math.min(.97,p+g)?'g':'m';if(k==='g'&&m.perfAny)k='p';return k;}

function cbBegin(st,ai,rng){const s=st.S[ai],ev={ai};s.own++;
 s.dot.forEach(d=>{s.hp=Math.max(0,s.hp-d.v);ev.dot=(ev.dot||0)+d.v;d.t--;});s.dot=s.dot.filter(d=>d.t>0);
 if(s.hp<=0){st.win=1-ai;return ev;}
 if(s.has.mystic&&s.own%2===0)ev.myst=rbuf(s,rng,16);
 if(s.stun){s.stun--;ev.stun=1;st.turn++;}return ev;}

function cbPre(st,ai,ev,useSk,useUlt){const a=st.S[ai],d=st.S[1-ai];
 if(useSk&&a.sk>=100){const k=skSlot(a);if(k>=0){a.sk=0;a.skI=k+1;const id=a.slots[k];FX[id][k](a,d);ev.sk=k;ev.skn=CK[id].s[k][0];}}
 if(useUlt&&ultOk(a)){a.ult=0;a.streak=0;ev.ult=1;const id=a.slots[3];if(id){FX[id][3](a,d);ev.un=CK[id].s[3][0];}}return ev;}

function cbRes(st,ai,kind,ev,rng){const a=st.S[ai],d=st.S[1-ai],n=nxAgg(a);ev.kind=kind;
 const done=()=>{a.nx.forEach(x=>x.n--);a.nx=a.nx.filter(x=>x.n>0);};
 if(kind==='m'&&n.retry){a.nx=a.nx.filter(x=>!x.retry);done();ev.retry=1;a.streak=0;return ev;}
 const green=kind!=='m';let mult=kind==='p'?1.6:green?1:(a.has.uncle?.4:0);
 if(green){mult*=1+(n.dmgUp||0)+(n.gDmg||0);a.streak++;}else{mult*=1+(n.dmgUp||0);a.streak=0;if(a.has.colonel)a.nx.push({n:2,gw:.1});}
 if(ev.ult){mult=Math.max(mult,.5)*2;if(a.has.scar&&a.hp<a.max*.4)mult*=1.25;}
 let dmg=mult?Math.max(1,Math.round(aAtk(a)*mult*.5*100/(100+aAr(d)*(1-(n.pierce||0)))*(d.has.fluffy?.9:1))):0;
 d.hp=Math.max(0,d.hp-dmg);ev.dmg=dmg;
 if(dmg){if(d.has.hothead&&d.hot<5)d.hot++;const dr=(n.drain||0)+(a.has.sueb&&green?.15:0);if(dr){heal(a,dmg*dr);ev.drain=Math.round(dmg*dr);}}
 if(green){if(n.gStun){d.stun=1;ev.stunned=1;}if(n.gExtra)ev.extra=rbuf(a,rng);
  if(n.gCycle){const c=(a.cyc=(a.cyc|0)+1)%4;[()=>heal(a,12),()=>a.tb.push({ar:12,t:2}),()=>a.tb.push({atk:12,t:2}),()=>{a.ult=Math.min(100,a.ult+15);}][c]();ev.extra=['❤️','🛡️','💪','🌟'][c];}
  if(ev.ult&&a.scU){a.ult=Math.min(100,a.ult+30);a.scU=0;}}
 if(a.kpU){a.kpU--;if(a.streak>=2){heal(a,a.max*.15);a.ult=Math.min(100,a.ult+20);a.kpU=0;ev.extra='🍳';}}

var CROPS=[{id:'grass',n:'หญ้าไข่อ่อน',e:'🌱',cost:10,sec:60,y:17,cl:1},{id:'corn',n:'ข้าวโพดไข่',e:'🌽',cost:30,sec:600,y:55,cl:1},{id:'star',n:'ดอกไข่ดาว',e:'🌼',cost:100,sec:1800,y:175,cl:2},{id:'gold',n:'ต้นไข่ทอง',e:'🌟',cost:300,sec:7200,y:605,cl:3},{id:'emp',n:'ต้นไข่จักรพรรดิ',e:'👑',cost:800,sec:21600,y:1805,cl:4}];
var cropOf=id=>CROPS.find(c=>c.id===id)||CROPS[0];
var coopLv=()=>S.cl||1,COOP_UP=[0,3000,8000,14000];
var GACHA_ETK=1000,GRATE=[50,30,14,5,1];
function rollStar(){S.p4=(S.p4|0)+1;S.p5=(S.p5|0)+1;let t=roll(GRATE);if(S.p5>=120)t=4;else if(S.p4>=30&&t<3)t=R()<1/6?4:3;if(t>=3)S.p4=0;if(t>=4)S.p5=0;return t;}
function plant(i,quiet,cid){const f=S.fm,p=f.plots[i];if(!p||p.s!=='e')return false;const c=cropOf(cid||f.crop);if(c.cl>coopLv()){if(!quiet)toast(`🔒 ปลดที่เล้า Lv.${c.cl}`);return false;}
 const sc=seedCost(c);if((S.coins|0)>=sc)S.coins-=sc;else if(c.id==='grass'&&!f.plots.some(q=>q.s==='g')){if(!quiet)toast('🎁 เดือยเงินหมด — แจกเมล็ด 🌱 หญ้าฟรี!');}else{if(!quiet)toast(`🪙 เดือยเงินไม่พอ (ต้องใช้ ${sc})`);return false;}const d=c.sec*1000*(1-jobBuff().tend);f.plots[i]={s:'g',t:Date.now()+d,d,c:c.id};if(!quiet)save();return true;}
function harvest(i,quiet){const f=S.fm,p=f.plots[i];if(!p||p.s!=='g'||Date.now()<p.t)return 0;const c=cropOf(p.c),full=Math.round(c.y*(1+jobBuff().reap)),lost=Math.min(full,p.lo|0),y=full-lost;
 S.etk=(S.etk|0)+y;f.plots[i]={s:'e'};addXP(c.cl*2);if(lost){S.stolen=(S.stolen|0)+lost;const [x,z]=plotXZ(i);try{floatText(`🥷 -${lost}`,new THREE.Vector3(x,0,z-.6),1.5);}catch(e){}}
 if(!quiet){snd(900,.08,'triangle',.05,1.3);toast(`${c.e} +🥚${y}${lost?` (🥷 เพื่อนขโมยไป ${lost})`:''}`);save();}return y;}
function tapField(i){const f=S.fm,now=Date.now();if(i>=f.plots.length){toast('🌱 ซื้อแปลงเพิ่มที่ 🏗️ โรงช่าง');return;}
 const reap=j=>{const p=f.plots[j],e=cropOf(p.c).e,y=harvest(j,true);if(y){const [x,z]=plotXZ(j);floatText(`${e} +🥚${y}`,new THREE.Vector3(x,0,z),1);feathers(x,.2,z,0xffd23f,5);}return y;};
 if(i<0){/* ป้ายเหนือไร่ = ทำทีเดียวทุกแปลง */let got=0;f.plots.forEach((p,j)=>{if(p.s==='g'&&now>=p.t)got+=reap(j);});
  if(got){flyIcons(['🥚+'+fmt(got)],fieldC,1.2);snd(900,.08,'triangle',.05,1.3);vib(15);save();return;}
  if(f.plots.some(p=>p.s==='e')){cropPick(-1);return;}
  if(!skipAsk('field')){const m=Math.min(...f.plots.map(p=>p.t));floatText('⏳ '+tLeft(m),fieldC,1.4);}return;}
 const p=f.plots[i];
 if(p.s==='g'&&now>=p.t){reap(i);snd(900,.08,'triangle',.05,1.3);vib(15);save();return;}
 if(p.s==='e'){cropPick(i);return;}
 if(!skipAsk('field',i)){const [x,z]=plotXZ(i);floatText(`${cropOf(p.c).e} ⏳ ${tLeft(p.t)}`,new THREE.Vector3(x,0,z),1.2);}}
function cropPick(i){const f=S.fm,e=f.plots.filter(p=>p.s==='e').length,cl=coopLv(),one=i>=0;
 showModal(`<div class="em">🌱</div><h2>${one?`ปลูกแปลงที่ ${i+1}`:`ปลูกทุกแปลงว่าง (${e} แปลง)`}</h2><div class="sub">ค่าเมล็ดจ่ายด้วย 🪙 เดือยเงิน • มี 🪙${fmt(S.coins|0)}${jobList().some(Boolean)?'<br>👷 '+jobSum():''}</div><div class="crl">${CROPS.map(c=>{const lk=c.cl>cl;return `<button class="crp ${lk?'lk':''}" data-crop="${c.id}"><span class="ce">${c.e}</span><span class="crm"><b>${c.n}</b><small>${lk?`🔒 ปลดที่เล้า Lv.${c.cl}`:`⏱️ ${fmtDur(Math.round(c.sec*(1-jobBuff().tend)))} • ได้ 🥚${Math.round(c.y*(1+jobBuff().reap))}/แปลง`}</small></span><b class="cc">🪙${seedCost(c)}${one?'':'×'+e}</b></button>`;}).join('')}</div>`,
  one&&e>1?[{t:`🌱 ปลูกทุกแปลงว่าง (${e})`,f:()=>setTimeout(()=>cropPick(-1),50)},{t:'ปิด',c:'g'}]:[{t:'ปิด',c:'g'}]);
 document.querySelectorAll('[data-crop]').forEach(b=>b.onclick=()=>{const c=cropOf(b.dataset.crop);if(c.cl>coopLv()){toast(`🔒 ปลดที่เล้า Lv.${c.cl} (อัปเกรดที่ 🏗️ โรงช่าง)`);return;}f.crop=c.id;let n=0;
  (one?[i]:f.plots.map((_,j)=>j)).forEach(j=>{if(f.plots[j].s==='e'&&plant(j,true,c.id)){n++;const [x,z]=plotXZ(j);floatText(c.e,new THREE.Vector3(x,0,z),.8);}});
  if(!n){toast(`🪙 เดือยเงินไม่พอ (ต้องใช้ ${seedCost(c)}/แปลง)`);return;}
  const cb=[...document.querySelectorAll('#mbox .row button')].pop();if(cb)cb.click();snd(700,.06,'triangle',.05,1.3);save();});}
function coopUp(){const cl=coopLv(),c=COOP_UP[cl];if(!c)return;if((S.etk|0)<c){toast(`🥚 เบี้ยไข่ไม่พอ (ต้องใช้ ${fmt(c)})`);return;}
 modal(`<div class="em">🏠</div><h2>อัปเกรดเล้า Lv.${cl+1}?</h2><p>ปลดพืช ${CROPS.filter(x=>x.cl===cl+1).map(x=>x.e+' '+x.n).join(', ')}<br>ใช้ 🥚${fmt(c)}</p>`,[{t:`อัปเกรด 🥚${fmt(c)}`,c:'r',f:()=>{if((S.etk|0)<c)return;S.etk-=c;S.cl=cl+1;fanfare();toast(`🏠 เล้า Lv.${S.cl}!`);save();renderProd();}},{t:'ไว้ก่อน',c:'g'}]);}
/* ย้ายเซฟ: ของเก่าทั้งหมด → เดือยเงิน • คืนเงินที่ลงทุนในระบบที่ปิด • ไม่มีใครเสียของ */
function fixGrow151(){const f=S.fm;if(!f||!f.plots)return;const now=Date.now();f.plots.forEach(p=>{if(p.s!=='g')return;const c=cropOf(p.c),d=c.sec*1000;if(p.d>d){p.t=Math.min(p.t,now+d);p.d=d;}});}
function migrate151(){if(S.v151tw)return;S.v151tw=1;const had=(S.towerBest|0)>0;S.tower=1;S.towerBest=0;save();if(had&&S.tut<0)setTimeout(()=>modal(`<div class="em">🗼</div><h2>รีเซ็ตทาวเวอร์เล้า</h2><p>ทุกคนเริ่มจาก <b>ชั้น 1</b> ใหม่พร้อมกัน<br>รางวัลผ่านชั้นครั้งแรก 🎁 รับได้อีกรอบ!</p>`,[{t:'ลุย!',c:'g'}]),2500);}
function migrate150(){if(S.v150||!S.fm)return;S.v150=1;const f=S.fm;let goods=0,ref=0;
 Object.keys(f.st||{}).forEach(k=>{if(GOODS[k]&&k!=='feed')goods+=(f.st[k]|0)*GOODS[k].p;});['egg','feather','manure'].forEach(k=>{goods+=Math.floor((f.rd&&f.rd[k])||0)*GOODS[k].p;});
 (f.kit||[]).forEach(k=>{if(k&&k.r){const r=RECIPES.find(x=>x.id===k.r);if(r)Object.keys(r.out).forEach(o=>{if(GOODS[o])goods+=GOODS[o].p*r.out[o];});}});
 for(let k=1;k<(f.kit||[]).length;k++)ref+=kitCost(k);for(let l=0;l<(f.sto|0);l++)ref+=stoCost(l);if(f.auto)ref+=AUTO_PRICE;if(f.trac)ref+=TRAC_PRICE;
 const bank=Math.floor(S.bank||0);S.bank=0;S.coins+=goods+ref+bank;f.st={feed:f.st&&f.st.feed|0};f.rd={egg:0,feather:0,manure:0};f.kit=[null];f.auto=0;f.trac=0;
 const grow=f.plots.filter(p=>p.s==='g').length;f.plots=f.plots.map(()=>({s:'e'}));while(f.plots.length<6)f.plots.push({s:'e'});
 S.cl=S.cl||(S.lvl>=8?3:S.lvl>=5?2:1);S.etk=(S.etk|0)+grow*30;save();
 if(S.tut<0)setTimeout(()=>modal(`<div class="em">🌱</div><h2>ฟาร์มใหม่ 1.5.0</h2><div style="text-align:left;line-height:1.6">ซื้อเมล็ดด้วย 🪙 เดือยเงิน → ปลูกพืชได้ <b>🥚 เบี้ยไข่</b> → สุ่มไก่ที่ 🎰 ตู้ (🥚1,000/ครั้ง)<br>
 <b>คืนของเก่าเป็นเดือยเงินให้แล้ว:</b><br>• ของในคลัง/รังไข่/ครัว 🪙${fmt(goods)}<br>• คืนเงินที่ลงทุน (ครัว/โกดัง/เครื่องอัตโนมัติ) 🪙${fmt(ref)}<br>• เดือยเงินในเครื่องปั๊ม 🪙${fmt(bank)}${grow?`<br>• ข้าวโพดที่กำลังโต ${grow} แปลง → 🥚${grow*30}`:''}<br>
 🏠 เล้าของคุณ Lv.${S.cl} • แปลงปลูก ${f.plots.length} แปลง<br><small>ไก่ทุกตัวอยู่ครบ</small></div>`,[{t:'ไปปลูกกัน! 🌱',c:'g'}]),5200);}

var JOB_SLOTS=[0,2,3,4,6],JOBS={tend:{i:'🌿',n:'ดูแลแปลง',d:'พืชโตไวขึ้น',u:'-'},reap:{i:'🧺',n:'เก็บเกี่ยว',d:'ได้ 🥚 ต่อแปลงมากขึ้น',u:'+'},save:{i:'🪙',n:'จัดซื้อเมล็ด',d:'ค่าเมล็ดถูกลง',u:'-'},guard:{i:'🛡️',n:'ไก่ยาม',d:'กัน 🦊 โจรขโมยพืช',u:'-'}};
var JOB_AFF={colonel:'guard',scar:'guard',kaprao:'tend',sleepy:'tend',hothead:'tend',mystic:'reap',skyking:'reap',goldleaf:'reap',fluffy:'reap',uncle:'save',hero:'save',boss:'save',lost:'save',rainbow:'*'};
function jobSlots(){return JOB_SLOTS[coopLv()]||2;}
function jobList(){const n=jobSlots(),ok=new Map(adults().map(i=>[i.id,i]));if(!Array.isArray(S.job))S.job=[];const seen=new Set();
 S.job=S.job.slice(0,n).map(j=>j&&ok.has(j.id)&&!seen.has(j.id)&&JOBS[j.r]?(seen.add(j.id),j):null);while(S.job.length<n)S.job.push(null);return S.job;}
function isWorker(id){return Array.isArray(S.job)&&S.job.some(j=>j&&j.id===id);}
function jobPow(it,r){const a=JOB_AFF[it.ch],m=(a===r||a==='*')?1.5:1;return Math.round(([.12,.10,.08,.07,.06][it.tier|0]+.01*((it.lv||1)-1))*m*(r==='guard'?2:1)*100)/100;}
function jobBuff(){const b={tend:0,reap:0,save:0,guard:0};jobList().forEach(j=>{if(!j)return;const it=S.items.find(i=>i.id===j.id);if(it)b[j.r]+=jobPow(it,j.r);});for(const k in b)b[k]=Math.min(k==='guard'?.75:.5,b[k]);return b;}
function seedCost(c){return Math.max(1,Math.ceil(c.cost*(1-jobBuff().save)));}
function pct(v){return Math.round(v*100)+'%';}
function jobSum(){const b=jobBuff();return Object.keys(JOBS).map(k=>`${JOBS[k].i}${JOBS[k].u}${pct(b[k])}`).join(' • ');}
function jobBlock(){const L=jobList(),n=L.filter(Boolean).length;
 return `<div class="pq"><div class="pqh">👷 ไก่ทำงานในเล้า ${n}/${L.length}</div><div class="sub">${n?jobSum():'ส่งไก่เข้าเล้า ช่วยให้ไร่ดีขึ้น (ไก่ที่ทำงานจะลงทีมสู้ไม่ได้)'}</div><button class="btn ${n<L.length&&adults().length>t4Ids().filter(x=>x!=null).length?'r':''}" data-job="1" style="width:100%;margin-top:6px">👷 จัดงานในเล้า</button></div>`;}
function jobEditor(){const L=jobList(),b=jobBuff();
 showModal(`<div class="em">👷</div><h2>งานในเล้า (${L.filter(Boolean).length}/${L.length})</h2><div class="sub">ไก่ดาวต่ำทำงานเก่งกว่า! • ไก่บางตัวถนัดงาน ได้ ×1.5 ⭐<br>ไก่ที่ทำงานอยู่จะลงทีมสู้ไม่ได้ • เพิ่มช่องได้ด้วยการอัปเกรดเล้า</div>
 <div style="text-align:left;margin-top:8px">${L.map((j,k)=>{const it=j&&S.items.find(i=>i.id===j.id);return `<div class="card" data-js="${k}" style="margin-bottom:6px;cursor:pointer"><div class="ic" style="width:44px;height:44px">${it?chickSVG(it.ch,44,it.sh):'<span style="font-size:24px;opacity:.5">＋</span>'}</div><div class="mid">${it?`<div class="nm">${esc(it.name)} ${tagH(it.tier)} <small>Lv.${it.lv||1}</small></div><div class="sub">${JOBS[j.r].i} ${JOBS[j.r].n} ${JOBS[j.r].u}${pct(jobPow(it,j.r))}${(JOB_AFF[it.ch]===j.r||JOB_AFF[it.ch]==='*')?' ⭐':''}</div>`:`<div class="nm">ช่องว่าง</div><div class="sub">แตะเพื่อส่งไก่เข้าทำงาน</div>`}</div></div>`;}).join('')}</div>
 <div class="t4sum">${jobSum()}</div>`,[{t:'✅ เสร็จ',c:'g',f:()=>{if(openSheet==='prod')renderProd();}}]);
 document.querySelectorAll('[data-js]').forEach(e=>e.onclick=()=>jobPick(+e.dataset.js));}
function jobPick(k){const L=jobList(),cur=L[k],tm=t4Ids(),C=adults().filter(i=>!isWorker(i.id)||(cur&&cur.id===i.id)).sort((a,b)=>a.tier-b.tier||(b.lv||1)-(a.lv||1));
 showModal(`<div class="em">👷</div><h2>ช่องงานที่ ${k+1}</h2><div class="sub">แตะปุ่มงานของไก่ที่ต้องการ • ⭐ = ถนัดงานนี้${C.some(i=>tm.includes(i.id))?'<br>🛡️ = อยู่ในทีม (จะถูกเอาออกจากทีม)':''}</div><div style="max-height:55vh;overflow:auto;text-align:left;margin-top:6px">${C.length?C.map(i=>`<div class="card" style="margin-bottom:6px"><div class="ic" style="width:40px;height:40px">${chickSVG(i.ch,40,i.sh)}</div><div class="mid"><div class="nm">${tm.includes(i.id)?'🛡️ ':''}${esc(i.name)} ${tagH(i.tier)} <small>Lv.${i.lv||1}</small></div><div style="display:flex;gap:4px;margin-top:4px">${Object.keys(JOBS).map(r=>{const a=JOB_AFF[i.ch];return `<button class="btn ${cur&&cur.id===i.id&&cur.r===r?'r':''}" data-jp="${i.id}" data-jr="${r}" style="flex:1;padding:6px 2px;font-size:13px">${JOBS[r].i}${JOBS[r].u}${pct(jobPow(i,r))}${a===r||a==='*'?'⭐':''}</button>`;}).join('')}</div></div></div>`).join(''):'<div class="sub">ยังไม่มีไก่โตว่าง — สุ่มไก่เพิ่มที่ 🎰</div>'}</div>
 <div class="sub">${Object.keys(JOBS).map(r=>`${JOBS[r].i} ${JOBS[r].n} = ${JOBS[r].d}`).join('<br>')}</div>`,
  [cur?{t:'เอาออก',f:()=>{S.job[k]=null;save();jobEditor();}}:null,{t:'← กลับ',c:'g',f:jobEditor}].filter(Boolean));
 document.querySelectorAll('[data-jp]').forEach(e=>e.onclick=()=>{const id=+e.dataset.jp,ti=tm.indexOf(id);if(ti>=0){S.t4[ti]=null;toast('🛡️ เอาออกจากทีมสู้แล้ว');}S.job[k]={id,r:e.dataset.jr};qEv('job');save();jobEditor();});}

/* ================= 🥷 เพื่อนขโมย & ป้องกัน 1.5.3 ================= */
var STEAL_GRACE=10,STEAL_PCT=.3,STEAL_MAX=300,DEF=[{k:'fence',i:'🪵',n:'รั้วไม้',c:500,r:.4,cl:1,d:'เพื่อนขโมยได้น้อยลง 40% + มีโอกาสโดนจับ'},{k:'cam',i:'📹',n:'กล้องเฝ้าฟาร์ม',c:2000,r:.6,cl:2,d:'เพื่อนขโมยได้น้อยลง 60% + มีโอกาสโดนจับ'},{k:'col',i:'🤖',n:'เครื่องเก็บอัตโนมัติ',c:5000,cl:3,d:'เก็บเกี่ยวให้เองทันทีที่สุก (ไม่เหลือให้ใครขโมย)'},{k:'smart',i:'🧠',n:'ฟาร์มอัจฉริยะ',c:25000,cl:4,d:'เก็บ + ปลูกพืชเดิมซ้ำให้เอง (จ่าย 🪙 ค่าเมล็ด)'}];
function hasDef(k){return !!(S.fm&&S.fm.df&&S.fm.df[k]);}
function thiefProt(){let m=1;DEF.forEach(d=>{if(d.r&&hasDef(d.k))m*=1-d.r;});m*=1-jobBuff().guard;return 1-m;}
function ripeEtk(){const f=S.fm;if(!f||!f.plots)return 0;const now=Date.now(),rb=jobBuff().reap;return f.plots.reduce((a,p)=>p.s==='g'&&now>=p.t+STEAL_GRACE*60000?a+Math.max(0,Math.round(cropOf(p.c).y*(1+rb))-(p.lo|0)):a,0);}
function buyDef(k){const d=DEF.find(x=>x.k===k);if(!d||hasDef(k))return;if(d.cl>coopLv()){toast(`🔒 ต้องเล้า Lv.${d.cl}`);return;}if((S.etk|0)<d.c){toast(`🥚 เบี้ยไข่ไม่พอ (ต้องใช้ ${fmt(d.c)})`);return;}
 S.etk-=d.c;S.fm.df=S.fm.df||{};S.fm.df[k]=1;fanfare();toast(`${d.i} ${d.n} พร้อมใช้งาน!`);save();if(openSheet==='prod')renderProd(true);}
function defBlock(){const cl=coopLv(),pr=thiefProt();
 return `<div class="pq"><div class="pqh">🥷 กันเพื่อนขโมยพืช • ป้องกัน ${pct(hasDef('col')||hasDef('smart')?1:pr)}</div><div class="sub">พืชสุกแล้วทิ้งไว้เกิน ${STEAL_GRACE} นาที เพื่อนที่แวะมาฟาร์มแอบขโมยได้<br>ป้องกันยิ่งสูง เพื่อนขโมยได้น้อย และมีโอกาสโดนจับ (ได้ค่าปรับ 🪙)<br>🛡️ ส่งไก่ยามได้ที่ 👷 งานในเล้า${jobBuff().guard?` (ตอนนี้ -${pct(jobBuff().guard)})`:''}</div>
 ${DEF.map(d=>`<div class="bld"><div class="mid"><b>${d.i} ${d.n}</b><div class="sub">${d.d}${d.cl>cl?` • 🔒 เล้า Lv.${d.cl}`:''}</div></div>${hasDef(d.k)?'<b>✅</b>':`<button class="btn ${(S.etk|0)>=d.c&&d.cl<=cl?'r':''}" data-def="${d.k}">🥚${fmt(d.c)}</button>`}</div>`).join('')}</div>`;}
