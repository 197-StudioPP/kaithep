 if(window.self!==window.top)return '⚠️ เกมถูกเปิดอยู่ในกรอบของหน้าอื่น — เปิดลิงก์เกมตรงๆ ในแท็บใหม่ถึงจะล็อกอิน Google ได้';
}catch(e){}return '';};

/* stop double-tap / pinch zoom on phones, keep fast taps working */
(function(){
 let last=0;
 document.addEventListener('touchend',function(e){
  var t=e.target;if(!t||!t.closest||t.closest('input,textarea,select'))return;
  var now=Date.now();
  if(now-last<350){e.preventDefault();if(t.tagName!=='CANVAS'&&typeof t.click==='function')t.click();}
  last=now;
 },{passive:false});
 ['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
 document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
 document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
 window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault();},{passive:false});
})();

<script>
/* ===== cloud (Firebase): optional login so a farm follows you to any device ===== */
window.CLOUD=(function(){
 const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey)return null;
 const base='https://www.gstatic.com/firebasejs/12.17.1/';
 let A=null;const sameDom=cfg.authDomain===location.host;
 const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
 const ready=load(base+'firebase-app-compat.js').then(()=>Promise.all([load(base+'firebase-auth-compat.js'),load(base+'firebase-firestore-compat.js')])).then(()=>{
  if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();A=auth;
  return auth.getRedirectResult().catch(()=>null).then(()=>new Promise(r=>{const un=auth.onAuthStateChanged(u=>{un();r({auth,db,user:u});});}));
 });
 ready.catch(()=>{});
 const errTh=e=>{const c=(e&&e.code)||'';return ({
  'auth/invalid-email':'อีเมลไม่ถูกต้อง','auth/user-not-found':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/wrong-password':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/invalid-login-credentials':'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'auth/email-already-in-use':'อีเมลนี้สมัครไว้แล้ว ลองกด "เข้าสู่ระบบ"','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัว',
  'auth/popup-closed-by-user':'ปิดหน้าต่างก่อนเข้าสู่ระบบเสร็จ','auth/cancelled-popup-request':'ปิดหน้าต่างก่อนเข้าสู่ระบบเสร็จ',
  'auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase (Authentication → Settings → Authorized domains)',
  'auth/operation-not-allowed':'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase','auth/network-request-failed':'เน็ตมีปัญหา ลองใหม่อีกครั้ง',
  'auth/too-many-requests':'ลองบ่อยเกินไป รอสักครู่แล้วลองใหม่','auth/missing-password':'กรอกรหัสผ่านด้วย',
  'auth/web-storage-unsupported':'เบราว์เซอร์นี้ปิดการเก็บข้อมูลไว้ — เปิดลิงก์เกมใน Chrome หรือ Safari (ปิดโหมดไม่ระบุตัวตน)',
  'auth/operation-not-supported-in-this-environment':(location.protocol!=='https:'&&location.protocol!=='http:')?'ล็อกอิน Google ไม่ได้เพราะเปิดเกมจากไฟล์ในเครื่อง — ต้องเปิดผ่านลิงก์เว็บ (https://…netlify.app) หรือใช้ล็อกอินด้วยอีเมลแทน':'เบราว์เซอร์ในแอปนี้ (LINE/Facebook/IG ฯลฯ) ล็อกอิน Google ไม่ได้ — กด ⋮ หรือ ⋯ แล้วเลือก "เปิดใน Chrome/Safari" หรือใช้ล็อกอินด้วยอีเมลแทน',
  'auth/unauthorized-domain':'โดเมนนี้ยังไม่ได้อนุญาตใน Firebase — Firebase Console → Authentication → Settings → Authorized domains → เพิ่มโดเมนเว็บเกม',
  'auth/popup-closed-by-user':'ปิดหน้าต่างล็อกอินก่อนเสร็จ ลองใหม่อีกครั้ง',
  'auth/popup-blocked':'เบราว์เซอร์บล็อกหน้าต่างล็อกอิน — แตะปุ่ม Google อีกครั้ง หรือใช้อีเมล+รหัสผ่านแทน (ได้ผลเหมือนกัน)',
  'auth/disallowed-useragent':'เบราว์เซอร์ในแอปนี้ล็อกอิน Google ไม่ได้ — เปิดลิงก์ใน Chrome/Safari หรือใช้อีเมลแทน'}[c])||('เกิดข้อผิดพลาด: '+(c||(e&&e.message)||'ไม่ทราบสาเหตุ'));};
 return {ready,errTh,getAuth:()=>A,sameDom};
})();
/* ===== player profiles: each player has their own farm ===== */
(function(){
 const LK='kaitep_profiles';
 const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
 const ss={get:k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}}};
 const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let P=[];try{P=JSON.parse(ls.get(LK))||[];}catch(e){P=[];}
 const old=ls.get('kaitep_v1');
 if(old){try{const o=JSON.parse(old);const id='p'+Date.now().toString(36);ls.set('kaitep_p_'+id,old);P.push({id,n:(o&&o.nick)||'ผู้เล่น 1'});ls.set(LK,JSON.stringify(P));}catch(e){}ls.del('kaitep_v1');}
 window.__profiles={list:()=>{try{return JSON.parse(ls.get(LK))||[];}catch(e){return [];}},
  rename:(id,n)=>{const L=window.__profiles.list();const x=L.find(p=>p.id===id);if(x){x.n=n;ls.set(LK,JSON.stringify(L));}},
  switchTo:()=>{ss.set('kaitep_pid','');location.reload();}};
 const pid=ss.get('kaitep_pid');
 const cur=P.find(p=>p.id===pid);
 if(cur){window.__PID=cur.id;window.__PNAME=cur.n;return;}
 const box=document.getElementById('profBox'),wrap=document.getElementById('prof');
 let armDel=null,cloud={state:window.CLOUD?'loading':'off',user:null,msg:'',busy:false,choose:null};
 function pick(id){ss.set('kaitep_pid',id);location.reload();}
 const sumOf=id=>{try{const d=JSON.parse(ls.get('kaitep_p_'+id));if(d)return `🪙${(d.coins||0).toLocaleString()} • 🐔 ${(d.items||[]).filter(i=>i.st===2).length} ตัว • 🗼 ${d.towerBest||0}`;}catch(e){}return '';};
 const nameOf=u=>(u.displayName||(u.email||'').split('@')[0]||'ผู้เล่น').slice(0,16);
 // --- enter the game with a cloud account: newest copy wins
 function enterCloud(){
  const u=cloud.user;if(!u)return;const cid='fb_'+u.uid;cloud.busy=true;cloud.msg='⏳ กำลังโหลดฟาร์มจากคลาวด์...';render();
  window.CLOUD.ready.then(({db})=>db.collection('saves').doc(u.uid).get()).then(doc=>{
   const local=ls.get('kaitep_p_'+cid);let lt=0;try{lt=(JSON.parse(local)||{}).t||0;}catch(e){}
   if(doc.exists&&doc.data()&&doc.data().data){const d=doc.data();if(!local||(d.t||0)>=lt)ls.set('kaitep_p_'+cid,d.data);finishCloud();return;}
   if(local){finishCloud();return;}
   const L=window.__profiles.list().filter(p=>!p.cloud&&ls.get('kaitep_p_'+p.id));
   if(!L.length){finishCloud();return;}
   cloud.busy=false;cloud.choose=L;cloud.msg='';render();
  }).catch(e=>{cloud.busy=false;cloud.msg='⚠️ โหลดข้อมูลคลาวด์ไม่ได้: '+(e&&e.code==='permission-denied'?'กฎฐานข้อมูล (Rules) ยังไม่ถูกต้อง':'เน็ตมีปัญหา ลองใหม่');render();});
 }
 function finishCloud(fromLocal){
  const u=cloud.user,cid='fb_'+u.uid;
  if(fromLocal){const d=ls.get('kaitep_p_'+fromLocal);if(d)ls.set('kaitep_p_'+cid,d);}
  const L=window.__profiles.list().filter(p=>p.id!==cid);L.unshift({id:cid,n:nameOf(u),cloud:true,email:u.email||''});ls.set(LK,JSON.stringify(L));
  pick(cid);
 }
 function cloudHTML(){
  if(cloud.state==='off')return '';
  let h=`<div style="background:#fff;border:3px solid #3b2a1a;border-radius:18px;padding:10px;margin-bottom:12px;text-align:left"><div style="font-weight:600;font-size:16px">☁️ บัญชีออนไลน์ <small style="font-weight:400;color:#7a6346">— เล่นต่อได้ทุกเครื่อง</small></div>`;
  if(cloud.state==='loading')h+=`<div class="sub" style="margin-top:6px">⏳ กำลังเชื่อมต่อ...</div>`;
  else if(cloud.state==='error')h+=`<div class="sub" style="margin-top:6px">⚠️ เชื่อมต่อระบบล็อกอินไม่ได้ (เน็ตหรือการตั้งค่า Firebase) — เล่นแบบในเครื่องด้านล่างได้</div>`;
  else if(cloud.choose){h+=`<div style="margin-top:6px;font-size:14px">บัญชีนี้ยังไม่มีฟาร์ม จะนำฟาร์มในเครื่องขึ้นบัญชี หรือเริ่มใหม่?</div>`+cloud.choose.map(p=>`<button class="pbtn" data-up="${esc(p.id)}" style="margin-top:6px"><span style="font-size:24px">⬆️</span><span><b>นำ "${esc(p.n)}" ขึ้นบัญชี</b><br><small>${sumOf(p.id)}</small></span></button>`).join('')+`<button class="btn" id="cNew" style="width:100%;margin-top:4px">🌱 เริ่มฟาร์มใหม่ในบัญชีนี้</button>`;}
  else if(cloud.user){const u=cloud.user;h+=`<div style="margin-top:6px;font-size:14px">เข้าสู่ระบบเป็น <b>${esc(u.displayName||u.email||'ผู้เล่น')}</b>${u.email&&u.displayName?`<br><small style="color:#7a6346">${esc(u.email)}</small>`:''}</div>
   <div style="display:flex;gap:6px;margin-top:8px"><button class="btn g" id="cPlay" style="flex:1;font-size:17px" ${cloud.busy?'disabled':''}>▶️ เล่นด้วยบัญชีนี้</button><button class="btn" id="cOut" ${cloud.busy?'disabled':''}>ออกจากระบบ</button></div>`;}
  else{const ENV=window.__kaitepEnv();if(ENV)h+=`<div class="sub" style="margin-top:6px;background:#fff1d6;border:2px solid #e2a13a;border-radius:10px;padding:6px 8px;color:#7a4a10;text-align:left">${ENV}</div>`;
   h+=`<button class="btn" id="cGoogle" style="width:100%;margin-top:8px;background:#fff;font-size:16px" ${cloud.busy?'disabled':''}><b style="color:#4285f4">G</b> เข้าสู่ระบบด้วย Google</button>
   <div class="sub" style="text-align:center;margin:6px 0">หรือใช้อีเมล</div>

 hatchQuiet={};const step=Math.max(2,sec/3000);for(let t=0;t<sec;t+=step)tick(Math.min(step,sec-t));if(nb){S.bank=b0;S.coins=c0;}
 hatchQuiet=null;const rd=S.slots.filter(x=>x&&x.p>=1).length-rd0,eg=(S.fm&&S.fm.rd?Math.floor(S.fm.rd.egg):0)-eg0,bank=Math.floor(S.bank-b0);
 const f=S.fm&&Array.isArray(S.fm.plots)&&Array.isArray(S.fm.kit)?S.fm:null,now=Date.now(),crop=f?f.plots.filter(p=>p.s==='g'&&now>=p.t).length:0,food=f?f.kit.filter(k=>k&&now>=k.t).length:0;
 const msg=[bank>0?`🏭 +🪙${fmt(bank)}`:'',rd>0?`🥚 ฟักเสร็จ ${rd}`:'',eg>0?`🐔 ไข่ใหม่ ${eg}`:'',crop?`🌽 สุก ${crop} แปลง`:'',food?`🍳 อาหารเสร็จ ${food}`:''].filter(Boolean);
 save();if(msg.length&&sec>=30){if(nb)setTimeout(()=>toast(`⏰ ${why} ${fmtDur(sec)}: ${msg.join(' • ')}`),200);else setTimeout(()=>afkShow(why||'ระหว่างไม่อยู่',sec,msg),why?300:1200);}}

async function doEnchant(it,m){

 S.coins-=cost;S.items=S.items.filter(i=>i.id!==m.id);if(S.rep===m.id)S.rep=null;
 let res;if(R()<EN_RATE[n]){it.en=n+1;res='ok';}else if(n>=3){const x=R();if(x<EN_BREAK){S.items=S.items.filter(i=>i.id!==it.id);if(S.rep===it.id)S.rep=null;res='break';}else if(x<EN_BREAK+EN_DOWN){it.en=n-1;res='down';}else res='fail';}else res='fail';
 save();syncMeshes();await enchFx(it,m,n,res);}

 const M=tbMine(),o=[{d:-1,smart:0,plan:'rand',en:0},{d:0,smart:1,plan:'def',en:0},{d:2,smart:1,plan:'def',en:2}][pit],used=new Set(),cnt=[0,0,0];
 const en=M.map(x=>{let c,g=0;do{c=pickChar(x.it.tier);g++;}while(used.has(c)&&g<20);used.add(c);let row=o.smart?TBE.PREF[c]:Math.floor(R()*3);while(cnt[row]>=2)row=(row+1)%3;
  return {ch:c,tier:chOf(c).t,lv:Math.max(1,Math.min(10,(x.it.lv||1)+o.d)),en:Math.min(5,(x.it.en|0)+o.en),name:chOf(c).n,row,col:cnt[row]++,plan:o.plan==='def'?TBE.DEF_PLAN[c].slice():Array.from({length:6},()=>Math.floor(R()*5)),um:0};});
 const nm=tbBotName(),avgT=M.reduce((a,x)=>a+x.it.tier,0)/M.length;
 tbRun({enemy:en,title:`${p.i} ${p.n} • vs 🤖 ${nm}`,back:()=>showSheet('fight'),again:()=>tbPit(pit),
  onEnd:win=>{if(!win)return `เสียค่าเข้า 🪙${p.fee} • ไก่ไม่เป็นไร แค่ช้ำ 🩹`;const pz=Math.round([15+6*avgT,90*(1+.25*avgT),380*(1+.25*avgT)][pit]);S.coins+=pz;const ups=tbMine().map(x=>winUp(x.it,true)).filter(u=>u.lv);save();return `ได้ 🪙${fmt(pz)}${ups.length?'<br>⬆️ เลเวลอัพ '+ups.length+' ตัว!':''}`;}});}
function tbTower(){if(!tbMine().length){toast('ยังไม่มีไก่โต — ฟักไข่ก่อนนะ');return;}const f=S.tower||1,c=towerPreview(f);
 const en=tbGenTeam({n:f<=2?2:3,tiers:[...Array(c.tier+1).keys()],top:c.tier,lv:c.lv,smart:f>=4,plan:f>=2?'easy':'rand',boss:c.boss,en:Math.floor(f/12)});
 tbRun({enemy:en,title:`🗼 หอคอยชั้น ${f}${c.boss?' 👹 บอส':''}`,back:()=>showSheet('fight'),again:()=>tbTower(),
  onEnd:win=>{if(win){const repeat=f<(S.towerBest||0);const rw=repeat?Math.round(c.reward/4):c.reward;S.coins+=rw;S.tower=f+1;let t=`ผ่านชั้น <b>${f}</b>! ได้ 🪙${fmt(rw)}`;
   if(f>(S.towerBest||0)){S.towerBest=f;t+=' • 🎉 สถิติใหม่!';toHost({t:'shout',f});if(c.boss&&(S.cards||0)<CARD_MAX){S.cards=(S.cards||0)+1;t+='<br>🃏 ล้มบอส! ได้การ์ดบล็อก';}}
   tbMine().forEach(x=>winUp(x.it,true));save();return t;}
   const ck=towerCk(f);S.tower=ck;save();return `ตกหอคอยที่ชั้น ${f} • กลับไปจุดเซฟชั้น <b>${ck}</b><br>ไก่ไม่ตาย ลองจัดทีม/แผนใหม่!`;}});}

function tbGhostTeam(r){if(Array.isArray(r.tm)&&r.tm.length)return r.tm.slice(0,3).map((u,i)=>{const c=chOf(u.ch)?u.ch:'sleepy';return {ch:c,tier:chOf(c).t,lv:cInt(u.lv,1,10),en:cInt(u.en,0,5),name:clip(u.name||chOf(c).n,20),row:cInt(u.row,0,2),col:cInt(u.col,0,1),plan:Array.isArray(u.plan)&&u.plan.length===6?u.plan.map(x=>cInt(x,0,4)):TBE.EASY_PLAN.slice(),um:cInt(u.um,0,2)};});
 const L=[];const g=r.g&&L2C(r.g.c);if(g)L.push({c:g.id,lv:r.g.lv,en:r.g.en,nm:r.g.nm});(r.farm||[]).forEach(f=>{const k=L2C(f.c);if(k&&L.length<3&&!(g&&f.u===r.gu))L.push({c:k.id,lv:f.lv,en:f.en,nm:f.nm});});
 const cnt=[0,0,0];return L.map(x=>{let row=TBE.PREF[x.c];while(cnt[row]>=2)row=(row+1)%3;return {ch:x.c,tier:chOf(x.c).t,lv:cInt(x.lv||1,1,10),en:cInt(x.en,0,5),name:clip(x.nm||chOf(x.c).n,20),row,col:cnt[row]++,plan:TBE.DEF_PLAN[x.c].slice(),um:0};});}

function qEv(k,n){if(!S||S.qi==null)return;S.qe=S.qe||{};S.qe[k]=(S.qe[k]|0)+(n||1);}
function qCur(){return S.qi!=null&&S.qi<QUESTS.length?QUESTS[S.qi]:null;}
function qProg(q){if(q.chk)return q.chk()?1:0;if(q.stat){if(S.qb==null){S.qb=q.stat();}return Math.max(0,q.stat()-S.qb);}return (S.qe||{})[q.ev]|0;}
const qN=q=>q.chk?1:(q.n||1);
const qDone=q=>qProg(q)>=qN(q);
function qShow(q){if(q.pg){const [c,g,u]=q.pg();if(u==='xp'){const f=S.fm,need=xpNeed(f.lv),fr=Math.min(1,(f.lv-1+f.xp/need)/(g-1));return [fr,`Lv.${f.lv}/${g} • XP ${f.xp}/${need}`];}if(u==='coin')return [c/g,`🪙${fmt(c)}/${fmt(g)}`];return [c/g,`${c}/${g} ${u||''}`];}const pr=Math.min(qProg(q),qN(q));return [pr/qN(q),`${pr}/${qN(q)}`];}
function qStep(q){if(q.s)return q.s;const t=String(q.d).split('<br>')[0].replace(/<[^>]+>/g,'').replace(/^🔓[^!]*!\s*/,'');return esc(t.length>70?t.slice(0,68)+'…':t);}
const qRw=r=>`🪙${fmt(r.c)}${r.e?' + 🥚'+['','ไข่สุ่ม','ไข่ดี','ไข่หายาก'][r.e]:''}`;
let qHintUntil=0,qSig='';
function qStart(){if(S.qi!=null)return;S.qi=0;S.qe={};S.qb=null;if(S.fm&&S.fm.rd.egg<3)S.fm.rd.egg=3;save();}
function qTick(){const el=$('#quest');if(!el)return;if(S.qall==null&&S.tut<0){S.qall=(S.items.length>=4||(S.w|0)>=3||(S.towerBest|0)>=3||(S.fm&&S.fm.lv>=3))?1:0;save();}['vil','chat','prod','list'].forEach(k=>{const b=document.querySelector(`#nav [data-t="${k}"]`);if(b)b.classList.toggle('hide',S.tut>=0||!unl(k));});if(S.tut>=0||!S.fm){el.classList.add('hide');return;}if(S.qi==null)qStart();
 const q=qCur();document.querySelectorAll('.qpulse').forEach(e=>e.classList.remove('qpulse'));
 document.querySelectorAll('.qhl').forEach(e=>e.classList.remove('qhl'));
 if(!q||view!=='farm'||B){el.classList.add('hide');return;}
 if(openSheet){el.classList.add('hide');if(!qDone(q)&&q.hl){for(const sel of q.hl){const t=document.querySelector(sel);if(t&&t.offsetParent){t.classList.add('qhl');break;}}}}
 const pr=Math.min(qProg(q),qN(q)),dn=pr>=qN(q);const sp=qShow(q);
 const h=dn?`<div class="qt">✅ ${esc(q.t)}</div><div class="qs"><b>แตะรับรางวัล ${qRw(q.r)}</b></div>`:`<div class="qt">📜 ${S.qi+1}/${QUESTS.length} • ${esc(q.t)}</div><div class="qs"><span class="qb"><i style="width:${Math.min(100,sp[0]*100)}%"></i></span>${sp[1]} • ${qRw(q.r)}</div><div class="qn">👉 ${qStep(q)}</div>`;
 if(h!==qSig){qSig=h;el.innerHTML=h;el.className=dn?'done':'';}if(!openSheet)el.classList.remove('hide');
 if(!dn&&q.at){const show=true;if(show){if(q.at.startsWith('nav:')){const b=document.querySelector(`#nav [data-t="${q.at.slice(4)}"]`);if(b&&openSheet!==q.at.slice(4))b.classList.add('qpulse');}else if(q.at==='menu')$('#meChip').classList.add('qpulse');}}}
function qPos(at){const f=S.fm;if(at==='nest')return [nest.position,.75];if(at==='trough')return [trough.position,.85];if(at==='field')return [fieldC,.7];if(at==='kitchen')return [kitchen.position,1.9];
 if(at==='market')return [market.position,1.75];if(at==='sign')return [sign.position,2.0];if(at==='gacha')return [gm.position,2.9];if(at==='pad')return [padPos(Math.max(0,S.slots.findIndex(x=>!x||x.p>=1))),.8];
 if(at==='sale'&&f.plots.length<PLOT_MAX){const [x,z]=plotXZ(f.plots.length);return [new THREE.Vector3(x,0,z),.4];}return null;}
function qHand(){const hd=$('#qhand');if(!hd)return;const q=qCur();
 const hz=hintAt&&Date.now()<hintAt.until;const ok=(hz||q)&&S.tut<0&&view==='farm'&&!B&&!openSheet&&!G&&!SP&&!kpOpen&&$('#modal').classList.contains('hide')&&(hz||(!qDone(q)&&q.at&&!q.at.startsWith('nav')&&q.at!=='menu'));
 const P=ok&&qPos(hz?hintAt.at:q.at);if(!P){hd.classList.add('hide');return;}const [x,y,vis]=scr(P[0],P[1]);hd.classList.toggle('hide',!vis);hd.style.left=x+'px';hd.style.top=y+'px';}
function qClaim(){const q=qCur();if(!q||!qDone(q))return;const r=q.r;S.coins+=r.c;let eg='';
 if(r.e){if(S.bag.length<eggCap(S.lvl)){S.bag.push(Math.min(4,r.e));eg=' + 🥚';}else S.coins+=60*r.e;}
 fanfare();vib(30);flyIcons(['🪙+'+fmt(r.c)+eg],nest.position,4,'coin');S.qi++;S.qe={};S.qb=null;qSig='';save();
 const n=qCur();const el=$('#quest');el.classList.remove('new');void el.offsetWidth;el.classList.add('new');
 if(n){qHintUntil=Date.now()+8000;const nu=S.qall?[]:Object.keys(UNL).filter(k=>UNL[k]===S.qi);if(nu.length){setTimeout(()=>{fanfare();modal(`<div class="em">🔓</div><h2>ปลดล็อกใหม่!</h2><p style="font-size:17px">${nu.map(k=>UNL_NAME[k]).join('<br>')}</p><div class="sub">ภารกิจต่อไป: ${esc(n.t)}</div>`,[{t:'ไปดูเลย!',c:'g'}]);},500);}else toast(`🎉 สำเร็จ! ภารกิจต่อไป: ${esc(n.t)}`);}
 else modal(`<div class="em">🏆</div><h2>ผ่านภารกิจสอนเล่นครบ!</h2><p>คุณเป็นเจ้าของฟาร์มไก่เทพตัวจริงแล้ว 🐔<br>ต่อจากนี้: ส่งใบสั่งซื้อทุกวัน • ปีนหอคอย • สะสมไก่ให้ครบสมุด • ชิงไก่เพื่อน!</p>`,[{t:'ลุย! 🐓',c:'g'}]);}
function qGo(q){qHintUntil=Date.now()+8000;if(q.at&&q.at.startsWith('nav:'))showSheet(q.at.slice(4));else if(q.at==='menu')openMenu();else{showSheet(null);setView('farm');}}
function qOpen(){const q=qCur();if(!q)return;if(qDone(q)){qClaim();return;}const pr=Math.min(qProg(q),qN(q));
 modal(`<div class="em">📜</div><h2>${esc(q.t)}</h2><div class="sub">ภารกิจ ${S.qi+1}/${QUESTS.length} • ความคืบหน้า ${qShow(q)[1]}</div><p style="text-align:left">${q.d}</p><div class="sub">🎁 รางวัล ${qRw(q.r)}</div>`,
  [{t:'👉 พาไปเลย',c:'g',f:()=>qGo(q)},q.skip?{t:'ข้าม',f:()=>{S.qi++;S.qe={};S.qb=null;qSig='';save();}}:null,{t:'ปิด'}].filter(Boolean));}
$('#quest').addEventListener('click',qOpen);

{const o=collectRd;collectRd=function(q){const r=o.apply(this,arguments);if(r&&r.length)qEv('collect');return r;};}

{const o=plant;plant=function(i){const a=S.fm.plots[i]&&S.fm.plots[i].s;o.apply(this,arguments);if(a==='e'&&S.fm.plots[i].s==='g')qEv('plant');};}
{const o=harvest;harvest=function(i){const a=S.fm.plots[i]&&S.fm.plots[i].s;o.apply(this,arguments);if(a==='g'&&S.fm.plots[i].s==='e')qEv('harvest');};}
{const o=cook;cook=function(){const a=S.fm.kit.filter(Boolean).length;o.apply(this,arguments);if(S.fm.kit.filter(Boolean).length>a)qEv('cook');};}
{const o=cookDone;cookDone=function(i){const k=S.fm.kit[i];o.apply(this,arguments);if(k&&!S.fm.kit[i]){qEv('cookDone');qEv('cook_'+k.r);}};}
{const o=sellGood;sellGood=function(){const a=S.coins;o.apply(this,arguments);if(S.coins>a)qEv('sell');};}
{const o=sellSpare;sellSpare=function(){const a=S.coins;o.apply(this,arguments);if(S.coins>a)qEv('sell');};}
{const o=fillOrder;fillOrder=function(i){const a=S.fm.ord.done[i];o.apply(this,arguments);if(!a&&S.fm.ord.done[i])qEv('order');};}
{const o=spinEgg;spinEgg=function(){const a=S.coins,b=S.bag.length;const r=o.apply(this,arguments);if(S.coins<a||S.bag.length>b)qEv('spin');return r;};}
{const o=placeEgg;placeEgg=function(i){const a=!!S.slots[i];const r=o.apply(this,arguments);if(!a&&S.slots[i])qEv('place');return r;};}
{const o=openGacha;openGacha=function(){qEv('hatch');return o.apply(this,arguments);};}
{const o=openDex;openDex=function(){qEv('dex');return o.apply(this,arguments);};}
{const o=showInfo;showInfo=function(){qEv('info');return o.apply(this,arguments);};}
{const o=renderVillage;renderVillage=function(){qEv('vil');return o.apply(this,arguments);};}
{const o=visitFarm;visitFarm=function(id){if(id!==S.gid)qEv('visit');return o.apply(this,arguments);};}
{const o=chatSend;chatSend=function(){const r=o.apply(this,arguments);if(r!==false)qEv('chat');return r;};}
{const o=startGhost;startGhost=function(){qEv('pvp');return o.apply(this,arguments);};}
{const o=raidFarm;raidFarm=function(){qEv('pvp');return o.apply(this,arguments);};}
